<body>
<div class="wrap">
<header class="masthead"><span class="eyebrow">V1.6</span><button class="ghost" id="rules-button">遊戲說明 ↗</button></header>
<div class="hero" id="game-heading" hidden><div><h1>校事委員的一天</h1><p class="subtitle">今天也要發大財!</p></div><div class="edition"><strong>五天．十校．你的選擇</strong>新聞議題改編 · 虛構制度諷刺遊戲</div></div>
<section id="dashboard" hidden class="dashboard" aria-label="委員狀態"><div class="stat"><div class="label">本週出勤委員</div><div class="value name" id="nickname-display">尚未報到</div></div><div class="stat"><div class="label">金錢指數 · 新臺幣</div><div class="value" id="money-display">0 <small>元</small></div></div><div class="stat"><div class="label">良心指數</div><div class="value" id="conscience-display">100 <small>/ 100</small></div><div class="meter"><span id="conscience-bar" style="width:100%"></span></div></div><div class="stat"><div class="label" id="schedule-label">一週行程 · 上午一校，下午一校</div><div class="week" id="week"></div></div></section>
<main>
<section id="cover" tabindex="-1" aria-label="遊戲封面"></section>
<div class="layout" id="game-layout" hidden>
<section class="map-shell" aria-label="消失縣十校大地圖"><div class="section-head"><strong>消失縣 出差路線圖</strong><span>全縣十校 · 順時針巡迴</span></div><div class="map-board" id="board"></div><div class="map-key"><span><i class="key-dot"></i>深綠外框＝目前位置</span><span>失靈越高，越難擋下不當調查</span></div></section>
<section id="panel" tabindex="-1" aria-label="目前劇情"></section>
</div>

const WORD_BANK={
 favorable:[...new Set(`有利於教師、對教師有益、有助於教師、支持教師立場、對教師有正面助益、有利於教師主張、有利事證、支持性證據、有力佐證、正面證據、有利佐證、支持教師主張的證據、忠實摘述、據實記錄、如實摘錄、客觀摘要、忠實呈現、據實陳述、客觀記述、忠實反映原意、依據物證研判、憑據判斷、依證據認定、依據客觀事證判斷、實證判斷、以物證為依據、根據事實研判、專注聆聽、仔細聆聽、用心傾聽、耐心聽取、細心聆聽、專心聽取、審慎聽取`.split('、'))],

};
const SLICE_RULES=Object.freeze({seconds:20,waves:5,waveSeconds:4,perCategory:10,minCorrect:6,maxWrong:2,penalty:1500});
function shuffled(items,rng=Math.random){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeSliceDeck(kind,rng=Math.random){const targetKey=kind==='bad'?'favorable':'unfavorable';const otherKey=kind==='bad'?'unfavorable':'favorable';const targets=shuffled(WORD_BANK[targetKey],rng).slice(0,10);const others=shuffled(WORD_BANK[otherKey],rng).slice(0,10);let deck=[];for(let wave=0;wave<5;wave++){deck.push(...shuffled([targets[wave*2],targets[wave*2+1]].map(text=>({text,target:true})).concat([others[wave*2],others[wave*2+1]].map(text=>({text,target:false}))),rng).map((w,lane)=>({...w,id:wave*4+lane,wave,lane})));}return deck;}
function slicePassed(correct,wrong,abandoned=false){return !abandoned&&correct>=SLICE_RULES.minCorrect&&wrong<=SLICE_RULES.maxWrong;}
// Segment/rectangle clipping catches fast swipes between pointer events.
function segmentHitsRect(a,b,r){let t0=0,t1=1;const dx=b.x-a.x,dy=b.y-a.y;const ps=[-dx,dx,-dy,dy],qs=[a.x-r.x,r.x+r.w-a.x,a.y-r.y,r.y+r.h-a.y];for(let i=0;i<4;i++){if(ps[i]===0){if(qs[i]<0)return false;}else{const t=qs[i]/ps[i];if(ps[i]<0)t0=Math.max(t0,t);else t1=Math.min(t1,t);if(t0>t1)return false;}}return true;}
function createState(nickname=''){return {nickname,index:0,money:0,conscience:100,phase:nickname?'case':'intro',teachers:SCHOOLS.map(()=>({pain:0,status:'未到訪',lostJob:false})),log:[],reckoningSeen:false,angrySeen:false,endReason:'',stopAt:'',phoneFrom:'',pendingPenalty:0,slice:null,sliceReport:null,lastSlice:null,forceFrom:''};}
function slotLabel(i){return DAYS[Math.floor(i/2)]+'・'+(i%2?'下午':'上午');}
function meetingIncome(s){return Math.max(0,3000-s.pendingPenalty);}
function applyBad(s,rng=Math.random,blockedOverride){if(s.phase!=='case')return false;const school=SCHOOLS[s.index];const blocked=typeof blockedOverride==='boolean'?blockedOverride:rng()*100<100-school.failure;const teacher=s.teachers[s.index];const income=meetingIncome(s),deduction=s.pendingPenalty;s.pendingPenalty=0;s.money+=income;s.conscience=Math.max(0,s.conscience-10);teacher.pain=blocked?5:school.pain;teacher.status=blocked?'不當調查被阻止':'遭不當認定';s.last={blocked,index:s.index,pain:teacher.pain,income,deduction};s.log.push({school:school.name,action:blocked?'壞心選擇被擋下':'壞心選擇通過',money:income});s.phase='result';return true;}
function advance(s){if(!['result','forced-next'].includes(s.phase))return false;if(s.phase==='forced-next'&&s.forceFrom==='reckoning'){s.forceFrom='';s.phase='case';return true;}s.forceFrom='';s.index++;if(s.index===10){s.phase='end';s.endReason=s.conscience===0?'full':'schedule';return true;}if(s.index===6&&!s.reckoningSeen){s.phase='reckoning';s.reckoningSeen=true;s.teachers.slice(0,6).forEach(t=>{if(t.status==='遭不當認定'&&t.pain>=70){t.lostJob=true;t.status='失去教職（根據真實案例改編）';t.pain=Math.min(100,t.pain+5);}});}else if(s.index===8&&!s.angrySeen){s.angrySeen=true;s.phase='angry';}else s.phase='case';return true;}
function resolveAngry(s,good){if(s.phase!=='angry')return false;if(good){s.stopAt='星期五・上午・憤怒老師事件';s.endReason='good';s.phase='end';s.log.push({school:'週五上午特別事件',action:'選擇良心，停止行程',money:0});}else s.phase='case';return true;}
function chooseGood(s){if(!['case','reckoning'].includes(s.phase))return false;s.phoneFrom=s.phase;s.stopAt=s.phase==='reckoning'?'星期四・出發前':slotLabel(s.index);s.endReason=s.phase==='reckoning'?'reckoning':'good';s.phase='phone';return true;}
function continueWork(s){if(s.phase!=='reckoning')return false;s.phase='case';return true;}
function resumePhone(s){if(s.phase!=='phone')return false;s.phase='case';s.phoneFrom='';s.endReason='';s.stopAt='';return true;}
function finishPhone(s){if(s.phase!=='phone')return false;if(s.phoneFrom==='case'){s.teachers[s.index].status='秉公處理';s.log.push({school:SCHOOLS[s.index].name,action:'秉公處理，停止行程',money:0});s.pendingPenalty=0;}s.phase='end';s.phoneFrom='';return true;}
function beginSlice(s,kind,rng=Math.random){if(!['case','reckoning'].includes(s.phase)||!['bad','good'].includes(kind))return false;if(kind==='bad'&&s.phase==='case'&&rng()*100<100-SCHOOLS[s.index].failure){s.slice=null;s.sliceReport=null;s.lastSlice=null;return applyBad(s,rng,true);}s.slice={kind,from:s.phase,index:s.index};s.sliceReport=null;s.phase='slice';return true;}
function completeSlice(s,correct,wrong,abandoned=false){if(s.phase!=='slice')return false;correct=Math.min(10,Math.max(0,Math.floor(Number(correct)||0)));wrong=Math.min(10,Math.max(0,Math.floor(Number(wrong)||0)));s.sliceReport={...s.slice,correct,wrong,abandoned:!!abandoned,passed:slicePassed(correct,wrong,abandoned)};s.phase='slice-feedback';return true;}
function acceptSlice(s,rng=Math.random){if(s.phase!=='slice-feedback')return false;const r=s.sliceReport;s.lastSlice=r;s.slice=null;s.phase=r.from;if(r.kind==='bad'){if(r.from==='reckoning'){if(!r.passed)s.pendingPenalty=Math.max(s.pendingPenalty,SLICE_RULES.penalty);s.phase='case';}else{applyBad(s,rng,false);s.last.challenge=r;s.pendingPenalty=!r.passed&&s.index<9?SLICE_RULES.penalty:0;}}else if(r.passed){chooseGood(s);}else{s.forceFrom=r.from;if(r.from==='case'){s.teachers[s.index].status='良心挑戰未通過';s.pendingPenalty=0;s.log.push({school:SCHOOLS[s.index].name,action:'良心切詞未過，繼續行程',money:0});}s.phase='forced-next';}return true;}

const stage=$('slice-stage');sliceRun={job,deck:makeSliceDeck(job.kind),active:false,elapsed:0,lastTime:null,wave:-1,words:[],correct:0,wrong:0,pointer:null,trail:[],frame:0,reduced:window.matchMedia('(prefers-reduced-motion:reduce)').matches};
stage.addEventListener('pointerdown',e=>{const r=sliceRun;if(!r||!r.active||r.pointer||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const point=slicePoint(e,stage);r.pointer={id:e.pointerId,point};try{stage.setPointerCapture(e.pointerId);}catch{}sweepWords(point,point);});

const release=e=>{const r=sliceRun;if(!r||!r.pointer||r.pointer.id!==e.pointerId)return;r.pointer=null;try{stage.releasePointerCapture(e.pointerId);}catch{}};stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);stage.addEventListener('lostpointercapture',release);

function slicePoint(e,stage){const rect=stage.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top};}
function startSliceRound(){const r=sliceRun;if(!r||r.active||state.phase!=='slice')return;r.active=true;$('slice-ready').hidden=true;$('slice-submit').disabled=false;spawnSliceWave(0);drawSliceWords();r.frame=requestAnimationFrame(tickSlice);}
function spawnSliceWave(wave){const r=sliceRun;if(!r)return;r.wave=wave;r.trail=[];const layer=$('slice-word-layer');layer.innerHTML='';r.words=r.deck.filter(w=>w.wave===wave).map(w=>{const el=document.createElement('button');el.type='button';el.className='slice-word';el.textContent=w.text;el.dataset.wordId=String(w.id);el.setAttribute('aria-label','切掉：'+w.text);layer.appendChild(el);return {...w,el,cut:false,unit:.1+Math.random()*.8,speed:(Math.random()<.5?-1:1)*(.17+Math.random()*.18),rect:null};});$('slice-wave').textContent=String(wave+1);}
function drawSliceWords(){const r=sliceRun;if(!r)return;const stage=$('slice-stage'),width=stage.clientWidth,height=stage.clientHeight;if(!width||!height)return;const laneHeight=(height-20)/4;const time=r.elapsed/1000;for(const w of r.words){if(w.cut)continue;const font=width<420?14:17;const ww=Math.min(Math.max(108,w.text.length*font+30),Math.min(250,width-32)),hh=Math.min(66,laneHeight-8);const span=Math.max(0,width-ww-24);const travel=w.unit+(r.reduced?0:time*w.speed);const bounce=((travel%2)+2)%2;const x=12+(bounce<1?bounce:2-bounce)*span;const y=10+w.lane*laneHeight+(laneHeight-hh)/2+(r.reduced?0:Math.sin(time*2+w.id)*3);w.rect={x,y,w:ww,h:hh};Object.assign(w.el.style,{width:ww+'px',height:hh+'px',fontSize:font+'px',transform:`translate(${x}px,${y}px)`});}r.trail=r.trail.filter(p=>r.elapsed-p.at<220);$('slice-stroke').setAttribute('points',r.trail.map(p=>p.x+','+p.y).join(' '));}
function tickSlice(now){const r=sliceRun;if(!r||!r.active||state.phase!=='slice')return;if(!document.hidden){if(r.lastTime!==null)r.elapsed+=Math.max(0,now-r.lastTime);r.lastTime=now;if(r.elapsed>=SLICE_RULES.seconds*1000){finishSliceRun(false);return;}const wave=Math.floor(r.elapsed/(SLICE_RULES.waveSeconds*1000));if(wave!==r.wave)spawnSliceWave(wave);drawSliceWords();$('slice-time').textContent=String(Math.ceil(SLICE_RULES.seconds-r.elapsed/1000));$('slice-time-bar').style.width=Math.max(0,100-r.elapsed/(SLICE_RULES.seconds*10))+'%';}else r.lastTime=null;r.frame=requestAnimationFrame(tickSlice);}
function sweepWords(a,b){const r=sliceRun;if(!r||!r.active)return;r.trail.push({...a,at:r.elapsed},{...b,at:r.elapsed});r.trail=r.trail.slice(-20);for(const w of r.words){if(!w.cut&&w.rect&&segmentHitsRect(a,b,w.rect))cutWord(w.id);}drawSliceWords();}
function cutWord(id){const r=sliceRun;if(!r||!r.active)return;const w=r.words.find(w=>w.id===id);if(!w||w.cut)return;w.cut=true;w.el.disabled=true;w.el.className='slice-word sliced';w.el.setAttribute('aria-hidden','true');if(w.target)r.correct++;else r.wrong++;$('slice-correct').textContent=String(r.correct);$('slice-wrong').textContent=String(r.wrong);$('slice-live').textContent=(w.target?'切對：':'誤切：')+w.text+'。目前切對 '+r.correct+' 個、誤切 '+r.wrong+' 個。';$('slice-live').className=w.target?'slice-positive':'slice-negative';$('slice-stroke').setAttribute('stroke',w.target?'#a8e6ab':'#ff998b');}
function finishSliceRun(abandoned=false){const r=sliceRun;if(!r||state.phase!=='slice')return;if(!r.active&&!abandoned)return;const correct=r.correct,wrong=r.wrong;stopSliceAnimation();if(completeSlice(state,correct,wrong,abandoned))render(true);}
function showSliceFeedback(){stopSliceAnimation();const r=state.sliceReport;let message='';if(r.kind==='bad'){message=r.from==='case'?`本場收入 ${meetingIncome(state).toLocaleString('zh-TW')} 元，將在完成本校結果時入帳。`:'這次是出發前的挑戰，不另計出席報酬。';message+=r.passed?' 本次不新增下場減薪。':r.from==='case'&&state.index===9?' 本週已無下一場會議，因此不再扣減收入。':' 下一場會議若選擇賺錢，收入為 1,500 元（減少 1,500 元），只影響一場。';}else message=r.passed?'你成功清掉足夠的不利詞語。接下來會收到同行來電，可選擇繼續行程或堅守良心。':r.from==='reckoning'?'良心挑戰未通過。無法進入良心結局，接著必須前往星期四上午的學校。':state.index===9?'良心挑戰未通過。這已是最後一場，將按行程結束結算，不屬於良心結局。':'良心挑戰未通過。無法進入良心結局，接著必須前往下一場會議。';$('slice-dialog').innerHTML=`<div class="slice-result"><span class="tag ${r.passed?'':'warn'}">${r.kind==='bad'?'賺錢':'良心'}切詞結果</span><h2 id="slice-title">${r.passed?'挑戰通過':'挑戰未通過'}</h2><div class="result-grid"><div>切對<strong>${r.correct} / 6</strong></div><div>誤切<strong>${r.wrong} / 2</strong></div><div>漏掉目標<strong>${10-r.correct}</strong></div></div><p>${r.abandoned?'你放棄了本次挑戰。 ':''}${message}</p><p class="note">通過條件：切對至少 6 個，誤切不超過 2 個。${r.kind==='good'&&!r.passed?'本次不加收入、不扣良心，也不增加教師痛苦。':''}</p><button class="primary" data-action="slice-accept" id="slice-accept">${r.kind==='good'?(r.passed?'接聽同行來電 →':'繼續行程 →'):'確認切詞結果 →'}</button></div>`;if(!$('slice-dialog').open)$('slice-dialog').showModal();$('slice-accept').focus();}

if(state.phase==='reckoning'){const victims=state.teachers.map((t,i)=>({t,sc:SCHOOLS[i]})).filter(x=>x.t.lostJob);body=card('星期四・出發前・特別事件',`<span class="tag warn">行程暫停 ／ 那些離開教室的人</span><h2>你的收入，<br>是誰的代價？</h2><p>${n}委員，你已入帳 <b>${state.money.toLocaleString('zh-TW')} 元</b>。今天早上，幾封信被塞進你的公事包。</p><p class="note">以下為加速時間線的虛構劇情：先前未被擋下、痛苦達 70 的案件，在這段故事中走向失業，痛苦再增加 5。不是實際解聘流程。</p>${victims.map(({t,sc})=>`<div class="loss-card"><b>${sc.teacher} 老師 · ${sc.name} <span class="tag warn">失去教職</span></b><p>${sc.after}</p><span class="note">痛苦指數 ${t.pain} / 100</span></div>`).join('')}<button class="good" data-action="good"><span>選擇良心</span><span class="arrow">♡</span></button><button class="bad" data-action="continue"><span>信先收起來，我還要賺大錢<span class="btn-detail">完成賺錢切詞挑戰後出發；未通過會降低下一場收入</span></span><span class="arrow">→</span></button>`);}
if(state.phase==='angry'){body=card('星期五・上午一開始・特別事件',`<span class="tag warn">憤怒老師事件</span><h2>「你還有良心嗎？」</h2><p>${n}委員，你正準備進入星期五上午的會議，一位憤怒的老師攔住了你。</p><div class="quote">「有老師因為被誣陷，丟了工作、甚至有人難過到自殺!這種黑心錢你也敢賺!你還有良心嗎?」</div><button class="bad" data-action="friday-continue"><span>繼續開校事</span><span class="arrow">→</span></button><button class="good" data-action="friday-good"><span>選擇良心</span><span class="arrow">♡</span></button>`);}
if(state.phase==='phone'){body=card('來電顯示・同業聯繫',`<div class="phone-icon" aria-hidden="true">☎</div><span class="tag warn">同行來電 ／ 你的決定還能改變</span><h2>「${n}，<br>別跟錢過不去啊。」</h2><div class="quote">「大家都是這樣做的。你這麼認真查證，往後誰還敢找你？放下良心，一起發大財，不好嗎？」</div><p>電話另一端，是虛構的同行「金算盤委員」。你望向公事包，裡面還有老師交來、等待被看見的資料。</p><p>你要繼續這趟行程，還是堅守良心？</p><button class="bad" data-action="resume-phone"><span>繼續行程</span><span class="arrow">→</span></button><button class="good" data-action="finish"><span>堅守良心，跳到結算</span><span class="arrow">♡</span></button><p class="note">來電中的選擇本身不增加報酬、不扣除良心；繼續行程會回到目前學校的案卷。</p>`);}
if(state.phase==='end'){body=card('星期五・17:00・行程結束',`<span class="tag">週五結算已完成</span><h2>${state.endReason==='full'?'滿載而歸。<br>你還剩下什麼？':state.endReason==='schedule'?'行程走完了。<br>代價還沒有結束。':'你選擇了停下來。'}</h2><p>${n}委員，${['full','schedule'].includes(state.endReason)?'十間學校的行程走完了，實際報酬已入帳。這是行程結束，老師們的故事仍在繼續。':`你在${state.stopAt}中止行程，保住 ${state.conscience} 點良心。已造成的傷害仍會列入結算。`}</p><button class="primary" data-action="show-results"><span>查看完整結算與新聞來源</span><span class="arrow">↓</span></button><button class="good" data-action="restart"><span>重新開始另一個選擇</span><span class="arrow">↻</span></button>${ledger()}`);renderEnd();}
$('panel').innerHTML=body;if(focus&&!['slice','slice-feedback'].includes(state.phase)){const target=state.phase==='intro'?$('cover'):state.phase==='end'?$('settlement'):$('panel');target.focus({preventScroll:true});if(state.phase==='end'||window.matchMedia('(max-width:760px)').matches)target.scrollIntoView({behavior:'auto',block:'start'});}if(state.phase==='slice')openSlice();else if(state.phase==='slice-feedback')showSliceFeedback();else stopSliceAnimation(true);}

function renderEnd(){const n=escapeHTML(state.nickname),total=state.teachers.reduce((a,t)=>a+t.pain,0),blocked=state.teachers.filter(t=>t.status==='不當調查被阻止').length;const title=state.endReason==='full'?'本週發財，良心歸零。':state.endReason==='schedule'?'行程走完了，代價仍在。':state.conscience===100?'一分未賺，良心完整。':'提早退場，留住一點良心。';$('settlement').innerHTML=`<div class="ending-banner"><div><span class="eyebrow">週五結算 ／ ${n}委員</span><h2>${title}</h2><p>${state.endReason==='full'?'你選了十次賺大錢。':state.endReason==='schedule'?'週五行程結束；本次未達成良心結局。':'你在'+state.stopAt+'選擇停止。'} ${blocked} 次不當調查被擋下；十位老師的痛苦合計 ${total} 點。</p></div><div class="ending-values"><div><small>金錢指數 · 新臺幣</small><b>${state.money.toLocaleString('zh-TW')}</b><small>元</small></div><div><small>良心指數</small><b>${state.conscience}</b><small>/ 100</small></div></div></div><div class="results-head"><div><h3>十位老師，十份代價。</h3><span class="note">尚未到訪的學校保留為 0；已發生的傷害不因提早結束而歸零。</span></div><button class="ghost" data-action="restart">再玩一次 ↻</button></div><div class="table-wrap"><table><caption class="note" style="text-align:left;padding:10px 16px">教師痛苦指數與案件結果（全部人物及數值均為虛構）</caption><thead><tr><th scope="col">行程</th><th scope="col">學校／教師</th><th scope="col">行政失靈</th><th scope="col">案件結果</th><th scope="col">痛苦指數</th></tr></thead><tbody>${SCHOOLS.map((sc,i)=>{const t=state.teachers[i];return `<tr><td>週${'一二三四五'[Math.floor(i/2)]} ${i%2?'下午':'上午'}</td><td><b>${sc.name}</b><br>${sc.teacher} 老師</td><td>${sc.failure} / 100</td><td>${t.status}</td><td class="pain-cell"><span class="pain-track" aria-hidden="true"><span style="width:${t.pain}%"></span></span><b>${t.pain}</b> / 100</td></tr>`;}).join('')}</tbody></table></div><section class="sources" aria-label="新聞與評論來源"><div class="eyebrow">遊戲結束，現實仍在繼續</div><h3>從遊戲回到真實報導</h3><p>以下列出真實新聞資料，點選另開新分頁。</p><div class="source-grid">${SOURCES.map(s=>`<a class="source" href="${s.url.replace(/&/g,'&amp;')}" target="_blank" rel="noopener noreferrer"><small>${s.outlet} ／ ${s.date}</small><b>${s.title} ↗</b><p>${s.desc}</p></a>`).join('')}</div><footer>本遊戲以報導中的程序公正爭議為創作靈感，並未主張新聞已證實委員因惡意調查取得報酬。真實個案的指控、機關回應與救濟結果，請依原始資料分別理解。每校報酬、良心值、痛苦值、行政失靈率與失業情節均為遊戲設計，不代表實際統計或法律結論。</footer></section>`;}
function showInfo(title,content){$('dialog-content').innerHTML=`<h2 id="dialog-title">${title}</h2>${content}`;$('info-dialog').showModal();}
$('rules-button').addEventListener('click',()=>showInfo('這一週，怎麼玩？',`<p>你是消失縣的虛構調查委員。從星期一到星期五，每天上午、下午各到一間學校，十間學校都在同一張地圖上。路線固定，不用擲骰決定步數。</p><ol><li><b>賺大錢：</b>每場基本收入 3,000 元、良心 −10。先判斷行政把關；成功就跳過切詞，未成功才切掉有利老師的詞。挑戰未過，下一場收入減少 1,500 元。全部通過、十校都選賺錢，可得 30,000 元，良心歸零。</li><li><b>行政把關：</b>被阻止機率 = 100% − 行政失靈指數。0 必定擋下；100 完全不擋；70 有 30% 機會擋下。每校獨立抽取一次。</li><li><b>老師痛苦：</b>壞心選擇被擋下仍造成 5 點壓力；未被擋下依案情增加 60–94 點。良心選項不增加痛苦。</li><li><b>選擇良心：</b>先切掉不利老師的詞。挑戰通過後接聽同行來電，可繼續行程或堅守良心進入結算；挑戰未過必須繼續下一場，不能進入良心結局。</li><li><b>第四天：</b>部分老師的失業劇情出現，再給你一次停止的機會。選擇繼續也會進行賺錢切詞挑戰；本身不加錢、不扣良心，但失敗會減少下一場收入。</li><li><b>星期五上午：</b>憤怒老師質問你，可繼續開校事，或選擇良心直接結算；此事件不需切詞、不會接到同行電話，也不增加收入或扣除良心。</li><li><b>切詞規則：</b>每回合 20 秒、五波，每波四詞；切對至少 6 個且誤切不超過 2 個才通過。支援滑鼠、觸控及鍵盤。減薪只影響下一場，不累計；最後一場失敗不追扣收入。</li><li><b>結局：</b>列出十位老師的痛苦、案件結果，以及七則新聞與評論來源。</li></ol><p class="note">為符合本作的諷刺計分，壞心路線即使遭阻止仍有固定虛構出席報酬；這不是實際費率。全程不傳送綽號，不使用外部圖片或字型。重新整理會重置進度並保留暱稱；按「再玩一次」會沿用暱稱直接開始新局。</p>`));

$('board').addEventListener('click',e=>{const el=e.target.closest('[data-school]');if(!el)return;const i=Number(el.dataset.school),sc=SCHOOLS[i],t=state.teachers[i];showInfo(sc.name,`<span class="tag">消失縣虛構學校 ／ ${slotLabel(i)}</span><p><b>${sc.teacher} 老師</b>・${sc.subject}</p><p>行政失靈指數：<b>${sc.failure} / 100</b><br>不當調查被阻止機率：<b>${100-sc.failure}%</b></p><p>目前結果：${t.status}<br>教師痛苦指數：${t.pain} / 100</p><p class="note">查看地圖不會更改行程。請在右側（手機為下方）案卷選擇行動。</p>`);});
$('cover').addEventListener('submit',e=>{if(e.target.id!=='start-form')return;e.preventDefault();if(state.phase!=='intro')return;nicknameDraft=normalizeNickname($('nickname').value);if(!nicknameDraft)return;saveNickname(nicknameDraft);state=createState(nicknameDraft);render(true);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='slice-start'){startSliceRound();return;}if(action==='slice-submit'){finishSliceRun(false);return;}if(action==='slice-abandon'){finishSliceRun(true);return;}let changed=false;if(action==='friday-continue')changed=resolveAngry(state,false);if(action==='friday-good')changed=resolveAngry(state,true);if(action==='slice-accept')changed=acceptSlice(state);if(action==='bad')changed=beginSlice(state,'bad');if(action==='good')changed=beginSlice(state,'good');if(action==='next')changed=advance(state);if(action==='continue')changed=beginSlice(state,'bad');if(action==='finish')changed=finishPhone(state);if(action==='resume-phone')changed=resumePhone(state);if(action==='restart'&&state.phase==='end'){nicknameDraft=state.nickname||nicknameDraft||'章大財';saveNickname(nicknameDraft);state=createState(nicknameDraft);$('settlement').innerHTML='';changed=true;}if(action==='show-results'){$('settlement').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});$('settlement').focus({preventScroll:true});}if(changed)render(true);});
$('cover').addEventListener('input',e=>{if(e.target.id==='nickname'){$('start-button').disabled=!normalizeNickname(e.target.value);}});
render();
